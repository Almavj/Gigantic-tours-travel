kind = "web"
previewPath = "/"
title = "Gigantic Tours & Travel"
version = "1.0.0"
id = "artifacts/gigantic-tours"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19855

[services.development]
run = "pnpm --filter @workspace/gigantic-tours run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gigantic-tours", "run", "build" ]
publicDir = "artifacts/gigantic-tours/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19855"
BASE_PATH = "/"
